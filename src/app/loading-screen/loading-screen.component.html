@if (show()) {
  <div class="loading-overlay">
    <div class="loading-content">
      <svg class="anim-rotate" width="36" height="36" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="7" stroke="var(--color-border-default)" stroke-width="2" />
        <path
          d="M15 8a7 7 0 0 1-7 7"
          stroke="var(--color-fg-default)"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
      <h3 class="loading-message" style="margin: 0">{{ message() }}</h3>
    </div>
  </div>
}
