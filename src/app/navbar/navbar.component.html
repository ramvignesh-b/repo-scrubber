<header class="Header" style="background-color: #161b22; border-bottom: 1px solid #30363d; padding: 0 1.5rem; height: 60px; display: flex; align-items: center; justify-content: space-between;">
  <div class="Header-item" style="margin-right: 2rem;">
    <a href="#" class="Header-link f4 d-flex flex-items-center" style="font-weight: 600; color: #fff;">
      <svg class="octicon octicon-repo mr-2" viewBox="0 0 16 16" version="1.1" width="20" height="20" aria-hidden="true" fill="#ffb300">
        <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path>
      </svg>
      <span>Repo Scrubber</span>
    </a>
  </div>
  
  <div class="Header-item Header-item--full" style="display: flex; align-items: flex-end; height: 100%;">
    <nav class="UnderlineNav" aria-label="Main Navigation" style="border: none; margin-bottom: -1px; display: flex; align-items: flex-end; height: 100%;">
      <div class="UnderlineNav-body" style="display: flex; gap: 8px;">
        <button class="UnderlineNav-item" [class.selected]="activeId() === 'scrub'" (click)="setActive('scrub')" type="button" style="color: var(--color-fg-muted); padding: 8px 16px; border: none; background: transparent; font-weight: 500; font-size: 0.95rem; cursor: pointer;">
          <svg class="octicon octicon-git-pull-request mr-1" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true" fill="currentColor">
            <path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.67 1.88a.75.75 0 0 1 1.06-.03l2.25 2.25a.75.75 0 0 1 0 1.06l-2.25 2.25a.75.75 0 0 1-1.06-1.06L8.44 8H4.75a.75.75 0 0 1 0-1.5h3.69L7.14 5.19a.75.75 0 0 1 .03-1.06ZM3 12.25a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM3 2.25a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"></path>
          </svg>
          Scrub
        </button>
        <button class="UnderlineNav-item" [class.selected]="activeId() === 'how-to'" (click)="setActive('how-to')" type="button" style="color: var(--color-fg-muted); padding: 8px 16px; border: none; background: transparent; font-weight: 500; font-size: 0.95rem; cursor: pointer;">
          <svg class="octicon octicon-book mr-1" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true" fill="currentColor">
            <path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A4.004 4.004 0 0 1 11.003 1h4.25a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.25c-.868 0-1.688.243-2.384.664a.75.75 0 0 1-.762 0A5.487 5.487 0 0 0 5.003 13H.75a.75.75 0 0 1-.75-.75ZM1.5 2.5v9h3.503c.732 0 1.424.162 2.047.455V3.801C6.425 2.973 5.4 2.5 4.253 2.5ZM14.5 11.5v-9h-3.5c-1.147 0-2.172.473-2.797 1.301v9.154c.623-.293 1.315-.455 2.047-.455h3.5Z"></path>
          </svg>
          How To?
        </button>
        <button class="UnderlineNav-item" [class.selected]="activeId() === 'about'" (click)="setActive('about')" type="button" style="color: var(--color-fg-muted); padding: 8px 16px; border: none; background: transparent; font-weight: 500; font-size: 0.95rem; cursor: pointer;">
          <svg class="octicon octicon-info mr-1" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true" fill="currentColor">
            <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-5a.75.75 0 0 0-.75.75v4.5a.75.75 0 0 0 1.5 0v-4.5A.75.75 0 0 0 8 3Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path>
          </svg>
          About
        </button>
      </div>
    </nav>
  </div>
</header>
