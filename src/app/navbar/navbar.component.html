<header class="Header" style="background-color: #161b22; border-bottom: 1px solid #30363d; padding: 0 1.5rem; height: 60px; display: flex; align-items: center; justify-content: space-between;">
  <div class="Header-item" style="margin-right: 2rem;">
    <a href="#" class="Header-link f4 d-flex flex-items-center" style="font-weight: 600; color: #fff;">
      <span octicon="repo" color="#ffb300" [size]="20" class="mr-2"></span>
      <span>Repo Scrubber</span>
    </a>
  </div>
  
  <div class="Header-item Header-item--full" style="display: flex; align-items: flex-end; height: 100%;">
    <nav class="UnderlineNav" aria-label="Main Navigation" style="border: none; margin-bottom: -1px; display: flex; align-items: flex-end; height: 100%;">
      <div class="UnderlineNav-body" style="display: flex; gap: 8px;">
        <button class="UnderlineNav-item d-flex flex-items-center" [class.selected]="activeId() === 'scrub'" (click)="setActive('scrub')" type="button" style="color: var(--color-fg-muted); padding: 8px 16px; border: none; background: transparent; font-weight: 500; font-size: 0.95rem; cursor: pointer; gap: 4px;">
          <span octicon="git-pull-request" [size]="16"></span>
          Scrub
        </button>
        <button class="UnderlineNav-item d-flex flex-items-center" [class.selected]="activeId() === 'how-to'" (click)="setActive('how-to')" type="button" style="color: var(--color-fg-muted); padding: 8px 16px; border: none; background: transparent; font-weight: 500; font-size: 0.95rem; cursor: pointer; gap: 4px;">
          <span octicon="book" [size]="16"></span>
          How To?
        </button>
        <button class="UnderlineNav-item d-flex flex-items-center" [class.selected]="activeId() === 'about'" (click)="setActive('about')" type="button" style="color: var(--color-fg-muted); padding: 8px 16px; border: none; background: transparent; font-weight: 500; font-size: 0.95rem; cursor: pointer; gap: 4px;">
          <span octicon="info" [size]="16"></span>
          About
        </button>
      </div>
    </nav>
  </div>
</header>
