<div class="repo-list-container">
  <mat-card class="repo-card mat-elevation-z8">
    <mat-card-header class="repo-header">
      <mat-card-title class="repo-title">Your Repositories</mat-card-title>
      <mat-card-subtitle class="repo-subtitle">
        Found <strong>{{ repoListOG.length }}</strong> repositories
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="repo-content">
      <div class="filter-actions-bar">
        <div class="filters">
          <mat-form-field appearance="outline" class="search-field">
            <mat-label>Search by name</mat-label>
            <input matInput [(ngModel)]="searchText" (ngModelChange)="applyFilters()" placeholder="e.g. repo-scrubber">
            <mat-icon matSuffix class="filter-icon">search</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="type-field">
            <mat-label>Filter Type</mat-label>
            <mat-select [(ngModel)]="filterType" (selectionChange)="applyFilters()">
              <mat-option value="all">Show All</mat-option>
              <mat-option value="forked">Forked Only</mat-option>
              <mat-option value="original">Original Only</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="actions">
          <button mat-stroked-button (click)="reset()" class="action-btn refresh-btn">
            <mat-icon>refresh</mat-icon>
            Refresh
          </button>
          <button mat-flat-button color="warn" [disabled]="disabledDelete" (click)="onDeleteClick()" class="action-btn delete-btn">
            <mat-icon>delete_sweep</mat-icon>
            Delete Selected
          </button>
        </div>
      </div>

      <div class="list-scroll-container">
        <mat-selection-list #repoListSelection (selectionChange)="onSelectionChange()" class="repo-selection-list">
          <mat-list-option *ngFor="let repo of filteredRepoList; let i = index" [value]="repo.name" class="repo-item">
            <div class="repo-item-content">
              <mat-icon matListItemIcon class="repo-type-icon" [color]="repo.fork ? 'accent' : 'primary'">
                {{ repo.fork ? 'call_split' : 'star' }}
              </mat-icon>
              
              <div class="repo-info">
                <span class="repo-name">{{ repo.name }}</span>
                <span class="repo-badge" [class.badge-fork]="repo.fork" [class.badge-orig]="!repo.fork">
                  {{ repo.fork ? 'Fork' : 'Original' }}
                </span>
              </div>
              
              <span class="spacer"></span>
              
              <div class="repo-actions-end">
                <mat-icon *ngIf="repo.private" class="private-icon" title="Private Repository">lock</mat-icon>
                <a [href]="repo.url" target="_blank" mat-icon-button (click)="$event.stopPropagation()" class="open-link-btn" title="View on GitHub">
                  <mat-icon class="open-icon">open_in_new</mat-icon>
                </a>
              </div>
            </div>
          </mat-list-option>
        </mat-selection-list>

        <div *ngIf="filteredRepoList.length === 0" class="no-repos-found">
          <mat-icon class="empty-icon">folder_open</mat-icon>
          <p>No repositories match your current filters.</p>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
